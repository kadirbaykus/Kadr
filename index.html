<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriFit - Akıllı Mutfak Asistanı ve Tarif Önerici</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent: #ff9800;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 26px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        main {
            flex: 1;
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 90%;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--primary);
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
            font-weight: bold;
        }

        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }

        .ingredient-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fafafa;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .ingredient-checkbox:hover {
            background: #e8f5e9;
            border-color: var(--primary-light);
        }

        .ingredient-checkbox input {
            cursor: pointer;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: var(--primary-light);
        }

        .results-container {
            margin-top: 30px;
        }

        .recipe-card {
            background: #f9f9f9;
            border-left: 5px solid var(--primary);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .recipe-card h3 {
            color: var(--primary);
            margin-bottom: 5px;
        }

        .recipe-meta {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .recipe-ingredients {
            font-size: 14px;
            color: #444;
        }

        .no-result {
            text-align: center;
            color: #777;
            padding: 20px;
            font-style: italic;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #e0e0e0;
            font-size: 13px;
            color: #555;
            margin-top: auto;
        }
    </style>
</head>
<body>

        <p>Mutfağındakileri Seç, 50 Tariflik Veri Tabanından Uygun Yemekleri Keşfet!</p>
    </header>

        <div class="section-title">Mutfağında Hangi Malzemeler Var? (İstediklerini İşaretle)</div>

            <!-- JavaScript ile doldurulacak -->

                <div class="no-result">Henüz arama yapılmadı. Lütfen malzemelerinizi seçip butona tıklayın.</div>

    </main>

    <footer>

            { id: 42, name: "Şehriyeli Tavuk Suyu Çorbası", category: "Çorba", cal: 130, ingredients: ["Tavuk", "Şehriye", "Sıvı Yağ"] },

            { id: 45, name: "Peynirli Omlet", category: "Kahvaltı", cal: 220, ingredients: ["Yumurta", "Peynir", "Sıvı Yağ"] },
            { id: 46, name: "Ev Yapımı Pizza", category: "Ana Yemek", cal: 420, ingredients: ["Un", "Domates", "Kaşar Peyniri", "Sucuk", "Sıvı Yağ"] },
            { id: 47, name: "Sebzeli Bulgur Pilavı", category: "Yan Yemek", cal: 260, ingredients: ["Bulgur", "Domates", "Biber", "Soğan", "Sıvı Yağ"] },
            { id: 48, name: "Kıymalı Börek", category: "Hamur İşi", cal: 360, ingredients: ["Yufka", "Kıyma", "Soğan", "Süt", "Sıvı Yağ"] },
            { id: 49, name: "Patatesli Yumurta", category: "Kahvaltı", cal: 270, ingredients: ["Patates", "Yumurta", "Sıvı Yağ"] },
            { id: 50, name: "Sade Makarna", category: "Ana Yemek", cal: 300, ingredients: ["Makarna", "Tereyağı"] }
        ];

        // Tüm benzersiz malzemeleri otomatik çıkar ve listeyi oluştur
        function initIngredients() {
            const allIngredients = new Set();
            recipes.forEach(r => r.ingredients.forEach(i => allIngredients.add(i)));

            const container = document.getElementById('ingredientsList');
            container.innerHTML = '';

            Array.from(allIngredients).sort().forEach(ing => {
                container.innerHTML += `
                    <label class="ingredient-checkbox">
                        <input type="checkbox" value="${ing}"> ${ing}
                    </label>
                `;
            });
        }

        // Seçilen malzemelere göre tarifleri filtrele ve eşleşme oranına göre sırala
        function findRecipes() {
            const checkboxes = document.querySelectorAll('.ingredients-grid input[type="checkbox"]:checked');
            const userIngredients = Array.from(checkboxes).map(cb => cb.value);

            const resultsContainer = document.getElementById('recipeResults');

            if (userIngredients.length === 0) {
                resultsContainer.innerHTML = `<div class="no-result">Lütfen en az bir malzeme seçin!</div>`;
                return;
            }

            // Her tarifin kullanıcıda kaç malzemesi olduğuna bak
            const scoredRecipes = recipes.map(recipe => {
                const matched = recipe.ingredients.filter(ing => userIngredients.includes(ing));
                const matchRate = matched.length / recipe.ingredients.length;
                return {
                    ...recipe,
                    matchedCount: matched.length,
                    matchRate: matchRate,
                    missing: recipe.ingredients.filter(ing => !userIngredients.includes(ing))
                };
            });

            // En az 1 malzemesi uyanları filtrele ve eşleşme oranına göre sırala
            const matchedRecipes = scoredRecipes.filter(r => r.matchedCount > 0);
            matchedRecipes.sort((a, b) => b.matchRate - a.matchRate);

            if (matchedRecipes.length === 0) {
                resultsContainer.innerHTML = `<div class="no-result">Seçtiğiniz malzemelerle eşleşen bir tarif bulunamadı. Daha fazla malzeme seçmeyi deneyebilirsiniz.</div>`;
                return;
            }

            resultsContainer.innerHTML = '';
            matchedRecipes.forEach(r => {
                resultsContainer.innerHTML += `
                    <div class="recipe-card">
                        <h3>${r.name}</h3>
                        <div class="recipe-meta">Kategori: <b>${r.category}</b> | Kalori: <b>${r.cal} kcal</b> | Uyan Malzeme: <b>${r.matchedCount} / ${r.ingredients.length}</b></div>
                        <div class="recipe-ingredients"><b>Tüm Malzemeler:</b> ${r.ingredients.join(', ')}</div>
                        ${r.missing.length > 0 ? `<div style="font-size:13px; color:#d9534f; margin-top:4px;">Eksik Malzemeler: ${r.missing.join(', ')}</div>` : '<div style="font-size:13px; color:#2e7d32; margin-top:4px;"><b>Tüm malzemeler mutfağınızda mevcut!</b></div>'}
                    </div>
                `;
            });
        }

        // Sayfa açıldığında malzemeleri yükle
        window.onload = initIngredients;
    </script>
</body>
</html>
